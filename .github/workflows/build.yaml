name: build
on: pull_request
jobs:
  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup GCC
        run: |
          sudo apt update -y
          sudo apt install -y openmpi-bin libopenmpi-dev libnetcdf-dev libnetcdff-dev environment-modules
      - name: Build GCC
        run: |
          source /etc/profile.d/modules.sh
          export FC=mpifort
          export FFLAGS="-O2"
          export NCDFDIR=$(nc-config --prefix)
          export NCDFFDIR=$(nf-config --prefix)
          export LDOPT="-I${NCDFFDIR}/include -L${NCDFFDIR}/lib -L${NCDFDIR}/lib -lnetcdf -lnetcdff"
          #Compilation        
          cd src/chief/
          ln -sf read_wind_input_arno.f90     read_wind_input.f90
          ln -sf read_topo_input_arno.f90     read_topo_input.f90
          ln -sf read_current_input_arno.f90  read_current_input.f90
          ln -sf read_boundary_input_arno.f90 read_boundary_input.f90
          ln -sf read_ice_input_arno.f90      read_ice_input.f90
          cd ../preproc/
          ln -sf read_topography_arno.f90     read_topography.f90
          #deactivate OASIS          
          cd ../mod/
          ln -sf wam_oasis_inactive_module.f90 wam_oasis_module.f90
          #make
          cd ../../
          make all setENV=ci-GCC
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wam-binary-gcc
          path: bin/wam_gcc
  build-intel:
    runs-on: ubuntu-latest
    needs: build-gcc              #waits until gcc step is done
    container: intel/oneapi-hpckit:latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
      - name: Setup NetCDF
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh --force
          apt-get update -y
          apt-get install -y nodejs libnetcdf-dev zlib1g-dev m4 wget
          # Build NetCDF-Fortran with Intel compiler
          wget https://github.com/Unidata/netcdf-fortran/archive/refs/tags/v4.6.1.tar.gz
          tar xf v4.6.1.tar.gz
          cd netcdf-fortran-4.6.1
          FC=mpiifx CC=icx CPPFLAGS=-I/usr/include LDFLAGS=-L/usr/lib ./configure --prefix=/opt/netcdf-intel
          make -j4
          make install                  
      - name: Build Intel
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh --force
          export FC=mpiifx
          export FFLAGS="-heap-arrays 64 -fp-model precise -O3"
          export NCDFFDIR=/opt/netcdf-intel
          export NCDFDIR=$(nc-config --prefix)
          export LDOPT="-I${NCDFFDIR}/include -I${NCDFDIR}/include -L${NCDFFDIR}/lib -L${NCDFDIR}/lib -lnetcdf -lnetcdff"
          #Compilation
          cd src/chief/
          ln -sf read_wind_input_arno.f90     read_wind_input.f90
          ln -sf read_topo_input_arno.f90     read_topo_input.f90
          ln -sf read_current_input_arno.f90  read_current_input.f90
          ln -sf read_boundary_input_arno.f90 read_boundary_input.f90
          ln -sf read_ice_input_arno.f90      read_ice_input.f90
          cd ../preproc/
          ln -sf read_topography_arno.f90     read_topography.f90       
          #deactivate OASIS
          cd ../mod/
          ln -sf wam_oasis_inactive_module.f90 wam_oasis_module.f90
          cd ../../
          #make
          make all setENV=ci-Intel 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wam-binary-intel
          path: bin/wam_intel
